apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-reclamation-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-reclamation
  template:
    metadata:
      labels:
        app: central-reclamation
    spec:
      containers:
        - name: backend
          image: mariemfrikha/mon-image:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80